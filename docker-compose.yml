# Smart Transit Baku — tam sistem bir əmrlə:  docker compose up --build
# Sonra: http://localhost:3000 (sərnişin), http://localhost:3000/operator (dispetçer),
#        http://localhost:8080/api/docs (API sənədi)
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: transit
      POSTGRES_PASSWORD: transit
      POSTGRES_DB: smart_transit
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transit -d smart_transit"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  backend:
    build: ./backend
    environment:
      PORT: 8080
      DATABASE_URL: postgres://transit:transit@postgres:5432/smart_transit
      REDIS_URL: redis://redis:6379
      SIM_MODE: external          # GPS ayrıca "simulator" servisindən HTTP ilə gəlir
      SIM_SPEED: ${SIM_SPEED:-1}
      INTERNAL_KEY: ${INTERNAL_KEY:-change-me-internal}
      TOKEN_SECRET: ${TOKEN_SECRET:-change-me-secret}
    ports:
      - "8080:8080"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  simulator:
    build: ./backend
    command: ["node", "--import", "tsx", "src/sim/run.ts"]
    environment:
      API_URL: http://backend:8080
      INTERNAL_KEY: ${INTERNAL_KEY:-change-me-internal}
    healthcheck:
      disable: true
    depends_on:
      backend: { condition: service_healthy }

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
