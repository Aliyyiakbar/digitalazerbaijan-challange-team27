server {
  listen 80;
  root /usr/share/nginx/html;

  location /api/ { proxy_pass http://backend:8080; proxy_set_header X-Forwarded-For $remote_addr; }
  location /gtfs  { proxy_pass http://backend:8080; }
  location /gtfs-rt/ { proxy_pass http://backend:8080; }
  location /ws {
    proxy_pass http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
  }
  # service worker həmişə təzə olsun
  location = /sw.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
  location / { try_files $uri /index.html; }
}
